<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokacija i kontakt – Apartmani Dorana</title>
  <meta name="description" content="Apartmani Dorana, don Ive Prodana 17, Vrsi. Plaže, restorani i izleti u blizini. Pošaljite upit izravno domaćici.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610051512">
</head>
<body data-title="nav_contact">
  <header id="site-header"></header>

  <div class="wrap">
    <div class="page-head">
      <h1 data-i18n="loc_title"></h1>
      <p data-i18n="loc_p"></p>
    </div>

    <div class="split" style="align-items:start">
      <iframe class="map-frame" id="map" title="Map" loading="lazy"></iframe>
      <div class="card">
        <h3 data-i18n="loc_address"></h3>
        <p id="address"></p>
        <div class="btn-row">
          <a class="btn btn-primary" id="directions" target="_blank" rel="noopener" data-i18n="loc_directions"></a>
        </div>
        <h3 style="margin-top:28px" data-i18n="contact_direct"></h3>
        <p id="direct"></p>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="wrap grid-3">
      <div class="card"><h3 data-i18n="loc_beaches"></h3>
        <ul class="dist-list">
          <li><span>Punta Velebit</span><span>250 m</span></li>
          <li><span>Mulo</span><span>450 m</span></li>
          <li><span>Školjić</span><span>1,2 km</span></li>
          <li><span>Zukve</span><span>1,5 km</span></li>
          <li><span>Jasenovo</span><span>2,6 km</span></li>
        </ul></div>
      <div class="card"><h3 data-i18n="loc_food"></h3>
        <ul class="dist-list">
          <li><span>Capo</span><span>250 m</span></li>
          <li><span>Deli</span><span>500 m</span></li>
          <li><span>Castello Vrsi</span><span>650 m</span></li>
          <li><span data-i18n="loc_market"></span><span>500 m</span></li>
        </ul></div>
      <div class="card"><h3 data-i18n="loc_sights"></h3>
        <ul class="dist-list">
          <li><span>Sv. Mihovil</span><span>2,6 km</span></li>
          <li><span>Nin</span><span>5 km</span></li>
          <li><span data-i18n="loc_airport"></span><span>23 km</span></li>
        </ul></div>
    </div>
  </section>

  <section class="section alt">
    <div class="wrap">
      <div class="cta-band">
        <div><h2 data-i18n="loc_inquiry_cta"></h2><p data-i18n="form_p"></p></div>
        <div class="btn-row">
          <a class="btn btn-light" data-page="dostupnost.html" data-i18n="btn_avail"></a>
          <a class="btn btn-light" data-page="upit.html" data-i18n="nav_inquiry"></a>
        </div>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script type="module" src="js/kontakt.js?v=202610051512"></script>
</body>
</html>
