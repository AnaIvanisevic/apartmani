    };
    const AM = [["wifi","amen_wifi"],["ac","amen_ac"],["kitchen","amen_kitchen"],["bath","amen_bath"],["balcony","amen_balcony"],
                ["tv","amen_tv"],["bbq","amen_bbq"],["sup","amen_sup"],["washer","amen_washer"]];
    document.getElementById("amenities").innerHTML = AM.map(([i,k]) =>
      `<div class="amenity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[i]}</svg><span data-i18n="${k}"></span></div>`).join("");
    const { applyI18n } = await import("./js/i18n.js?v=202610051619");
    const { lang } = await import("./js/common.js?v=202610051619");
    applyI18n(lang, document.getElementById("amenities"));

    const { JEDINICE, BOOKING_URL } = await import("./js/podaci.js?v=202610051619");
    const { unitCard } = await import("./js/kartice.js?v=202610051619");
    const { lang: L0 } = await import("./js/common.js?v=202610051619");
    let lg = L0;
    const renderUnits = () => { document.getElementById("unit-grid").innerHTML = JEDINICE.map((u) => unitCard(u, lg)).join(""); };
    renderUnits();
    document.getElementById("rating-link").href = BOOKING_URL;
    const hs = document.getElementById("home-search");
    const td = new Date(); const tk = `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,"0")}-${String(td.getDate()).padStart(2,"0")}`;
    hs.od.min = tk; hs.do.min = tk;
    hs.od.addEventListener("change", () => { hs.do.min = hs.od.value || tk; });
    document.getElementById("hs-lang").value = lg;
    document.addEventListener("langchange", (e) => { lg = e.detail; renderUnits(); document.getElementById("hs-lang").value = lg; });

    if (NASLOVNA_FOTO) {
      const h = document.getElementById("hero");
      h.classList.add("has-photo");
      h.style.backgroundImage = `url("${NASLOVNA_FOTO}")`;
      h.querySelector(".hero-art").remove();
    }
