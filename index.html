<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apartmani Dorana – Vrsi, Zadar</title>
  <meta name="description" content="Apartmani Dorana u Vrsima kod Zadra: obiteljska kuća s 8 apartmana, 200 m od mora, besplatan parking među maslinama.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <section class="hero" id="hero">
    <svg class="hero-art" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="760" cy="410" r="70" fill="#ffd9a3" opacity=".95"/>
      <rect x="0" y="425" width="1440" height="295" fill="#2a6a80"/>
      <g fill="#ffd9a3" opacity=".55">
        <rect x="705" y="440" width="110" height="4" rx="2"/><rect x="725" y="456" width="70" height="3" rx="2"/><rect x="740" y="470" width="40" height="3" rx="2"/>
      </g>
      <path d="M0 560 Q240 520 480 548 T960 560 T1440 548 V720 H0Z" fill="#d9c7a6"/>
      <path d="M0 600 Q300 575 620 598 T1440 590 V720 H0Z" fill="#7d8a47"/>
      <!-- kuća -->
      <g transform="translate(1010 360)">
        <rect x="0" y="40" width="250" height="210" fill="#e7a7a2"/>
        <polygon points="-14,44 125,-8 264,44" fill="#b4533a"/>
        <rect x="58" y="-16" width="14" height="30" fill="#c98f86"/><rect x="176" y="-16" width="14" height="30" fill="#c98f86"/>
        <g fill="#f7efe6"><rect x="-12" y="108" width="274" height="10"/><rect x="-12" y="178" width="274" height="10"/></g>
        <g fill="#5b6f7a"><rect x="24" y="64" width="32" height="38"/><rect x="108" y="64" width="32" height="38"/><rect x="192" y="64" width="32" height="38"/>
          <rect x="24" y="134" width="32" height="38"/><rect x="108" y="134" width="32" height="38"/><rect x="192" y="134" width="32" height="38"/>
          <rect x="24" y="204" width="32" height="40"/><rect x="192" y="204" width="32" height="40"/></g>
        <rect x="108" y="204" width="32" height="46" fill="#8a4f35"/>
      </g>
      <!-- masline -->
      <g fill="#556b2f">
        <ellipse cx="130" cy="560" rx="110" ry="62"/><ellipse cx="60" cy="590" rx="80" ry="48"/>
        <ellipse cx="640" cy="575" rx="120" ry="58"/><ellipse cx="760" cy="600" rx="90" ry="44"/>
        <ellipse cx="1300" cy="585" rx="150" ry="70"/>
      </g>
      <g fill="#4a3a2a"><rect x="124" y="600" width="12" height="60"/><rect x="636" y="610" width="12" height="60"/><rect x="1296" y="630" width="14" height="60"/></g>
    </svg>
    <div class="wrap">
      <div class="kicker" data-i18n="hero_kicker"></div>
      <h1>Apartmani Dorana</h1>
      <p data-i18n="hero_sub"></p>
      <div class="btn-row">
        <a class="btn btn-primary" data-page="kuca-3d.html" data-i18n="btn_3d"></a>
        <a class="btn btn-light" data-page="lokacija.html" data-hash="#upit" data-i18n="btn_inquiry"></a>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="highlights">
      <div class="highlight"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 16c2 0 2-1.5 4-1.5S8 16 10 16s2-1.5 4-1.5S16 16 18 16s2-1.5 4-1.5M2 20c2 0 2-1.5 4-1.5S8 20 10 20s2-1.5 4-1.5S16 20 18 20s2-1.5 4-1.5"/><circle cx="12" cy="7" r="3.5"/></svg></div><strong data-i18n="hl_sea"></strong></div>
      <div class="highlight"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg></div><strong data-i18n="hl_parking"></strong></div>
      <div class="highlight"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></div><strong data-i18n="hl_units"></strong></div>
      <div class="highlight"><div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg></div><strong data-i18n="hl_rating"></strong></div>
    </div>
  </div>

  <section class="section">
    <div class="wrap split">
      <div>
        <div class="kicker">Vrsi · Mulo</div>
        <h2 data-i18n="about_title"></h2>
        <p class="lead" data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
      </div>
      <div class="card entrance-card">
        <h3 data-i18n="entrance_title"></h3>
        <p data-i18n="entrance_p"></p>
        <a class="btn btn-ghost" data-page="kuca-3d.html" data-i18n="btn_3d"></a>
      </div>
    </div>
  </section>

  <section class="section alt">
    <div class="wrap">
      <h2 data-i18n="amen_title"></h2>
      <div class="amenities" id="amenities"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap split">
      <div>
        <h2 data-i18n="rules_title"></h2>
        <ul class="rules">
          <li data-i18n="rules_checkin"></li><li data-i18n="rules_checkout"></li><li data-i18n="rules_quiet"></li>
          <li data-i18n="rules_nosmoke"></li><li data-i18n="rules_kids"></li><li data-i18n="amen_pets"></li>
        </ul>
      </div>
      <div class="cta-band" style="grid-template-columns:1fr">
        <div><h2 data-i18n="cta3d_title"></h2><p data-i18n="cta3d_p"></p></div>
        <a class="btn btn-light" data-page="kuca-3d.html" data-i18n="btn_3d"></a>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script type="module">
    import "./js/common.js";
    import { NASLOVNA_FOTO } from "./js/podaci.js";

    const ICON = {
      wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
      ac: '<rect x="2" y="4" width="20" height="9" rx="2"/><path d="M6 17v3M12 17v4M18 17v3M6 9h12"/>',
      kitchen: '<path d="M6 3v7a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 0-3 3-3 7h3v11"/>',
      bath: '<path d="M4 12h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM6 12V5a2 2 0 0 1 4 0"/>',
      balcony: '<path d="M3 11h18M5 11v9M9 11v9M12 11v9M15 11v9M19 11v9M3 20h18M7 11V4h10v7"/>',
      tv: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/>',
      bbq: '<path d="M4 9h16a8 8 0 0 1-16 0zM8 17l-2 4M16 17l2 4M9 2c0 2 2 2 2 4M14 2c0 2 2 2 2 4"/>',
      sup: '<ellipse cx="12" cy="12" rx="4" ry="10" transform="rotate(35 12 12)"/><path d="M5 19 19 5"/>',
      washer: '<rect x="3" y="2" width="18" height="20" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M7 6h2"/>',
    };
    const AM = [["wifi","amen_wifi"],["ac","amen_ac"],["kitchen","amen_kitchen"],["bath","amen_bath"],["balcony","amen_balcony"],
                ["tv","amen_tv"],["bbq","amen_bbq"],["sup","amen_sup"],["washer","amen_washer"]];
    document.getElementById("amenities").innerHTML = AM.map(([i,k]) =>
      `<div class="amenity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[i]}</svg><span data-i18n="${k}"></span></div>`).join("");
    const { applyI18n } = await import("./js/i18n.js");
    const { lang } = await import("./js/common.js");
    applyI18n(lang, document.getElementById("amenities"));

    if (NASLOVNA_FOTO) {
      const h = document.getElementById("hero");
      h.classList.add("has-photo");
      h.style.backgroundImage = `url("${NASLOVNA_FOTO}")`;
      h.querySelector(".hero-art").remove();
    }
  </script>
</body>
</html>
