name: Osvježi ocjenu s Bookinga

on:
  schedule:
    - cron: "17 5 */5 * *"   # svakih 5 dana u 05:17 UTC
  workflow_dispatch: {}      # ručno pokretanje s kartice Actions

permissions:
  contents: write

jobs:
  ocjena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instaliraj preglednik
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Dohvati ocjenu
        run: python alati/booking_ocjena.py
      - name: Spremi promjenu
        run: |
          if git diff --quiet; then echo "Nema promjene."; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add js/ocjena.js
          git commit -m "Automatski: ocjena s Bookinga"
          git push
